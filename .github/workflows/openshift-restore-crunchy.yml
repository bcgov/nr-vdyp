name: Openshift DB restore
run-name: Restore ${{ inputs.ENVIRONMENT_NAME }} database to ${{ inputs.TARGET_CLUSTER }}
on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT_NAME:
        description: Environment that wrote the backup
        required: true
        type: choice
        options: [dev, test, prod]
      REPOSITORY:
        description: Backup source (repo1 PVC requires the source cluster)
        required: true
        type: choice
        default: repo2
        options: [repo2, repo1]
      TARGET_CLUSTER:
        description: New PostgresCluster name (must not already exist)
        required: true
        type: string
      BACKUP_LABEL:
        description: Exact pgBackRest backup label in the selected repository
        required: true
        type: string
      RECOVERY_TARGET:
        description: Optional PITR timestamp with timezone; blank restores the backup
        type: string
      POSTGRES_VERSION:
        description: Optional PostgreSQL major version override; blank uses deployment chart
        default: ''
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: db-restore-${{ inputs.ENVIRONMENT_NAME }}-${{ inputs.TARGET_CLUSTER }}
  cancel-in-progress: false
jobs:
  restore:
    uses: ./.github/workflows/openshift-deploy-crunchy.yml
    with:
      ENVIRONMENT_NAME: ${{ inputs.ENVIRONMENT_NAME }}
      TARGET_CLUSTER: ${{ inputs.TARGET_CLUSTER }}
      REPOSITORY: ${{ inputs.REPOSITORY }}
      BACKUP_LABEL: ${{ inputs.BACKUP_LABEL }}
      RECOVERY_TARGET: ${{ inputs.RECOVERY_TARGET }}
      POSTGRES_VERSION: ${{ inputs.POSTGRES_VERSION }}
    secrets: inherit
