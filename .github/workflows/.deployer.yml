name: .Helm Deployer

on:
  workflow_call:
    inputs:
      ### Required
      # Only secrets!

      ### Typical / recommended
      directory:
        description: Chart directory
        default:  'charts/app'
        required: false
        type: string
      environment:
        description: Target environment (dev, test, or prod)
        required: true
        type: string
      oc_server:
        default: https://api.silver.devops.gov.bc.ca:6443
        description: 'OpenShift server'
        required: false
        type: string
      params:
        description: 'Extra parameters to pass to helm upgrade'
        default: ''
        required: false
        type: string
      ref:
        description: Full source and chart commit SHA
        required: true
        type: string
      tag:
        description: 12-character SHA tag or release version to deploy
        required: true
        type: string


      ### Usually a bad idea / not recommended
      timeout-minutes:
        description: 'Timeout minutes'
        default: 10
        required: false
        type: number
      values:
        description: Optional values file override; defaults to values-<environment>.yaml
        default: ''
        required: false
        type: string

    secrets:
      oc_namespace:
        required: true
      oc_token:
        required: true
      VITE_SSO_AUTH_SERVER_URL:
        required: true
      VITE_SSO_CLIENT_ID:
        required: true
      VITE_SSO_REALM:
        required: true
      VITE_SSO_REDIRECT_URI:
        required: true
      VITE_SSO_TOKEN_ISSUER:
        required: true
      VITE_API_URL:
        required: true
      KEYCLOAK_CLIENT_SECRET:
        required: true
      COMS_KEYCLOAK_PUBLICKEY:
        required: true
      NATS_PASSWORD:
        required: true
      POSTGRES_PASSWORD:
        required: true
      VDYP_DB_PASSWORD:
        required: true
      OBJECTSTORAGE_SECRETACCESSKEY:
        required: true
      COMS_SERVICE_PASSWORD:
        required: true
permissions:
  contents: read        # for actions/checkout
  packages: read
jobs:
  deployer:
    name: Helm
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-22.04
    concurrency:
      group: openshift-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ inputs.ref }}
      DISPLAY_TAG: ${{ inputs.tag }}
      VALUES_FILE: ${{ inputs.values || format('values-{0}.yaml', inputs.environment) }}
    steps:
      - name: Checkout exact source and Helm chart
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Validate source and image tag
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$DISPLAY_TAG" =~ ^[a-f0-9]{12}$ || "$DISPLAY_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          test "${#DISPLAY_TAG}" -le 63
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: redhat-actions/oc-installer@v1
      ### tag and release

      # Variables      
      - name: Set TAG and RELEASE vars for later use
        id: vars
        run: |
          # Vars: tag and release

          # The SHA or release version selects the application images.
          tag="$DISPLAY_TAG"

          # Stable Helm release name within each environment.
          release=${{ github.event.repository.name }}-${{ inputs.environment }}

          # Summary
          echo "tag=${tag}"
          echo "release=${release}"

          # Output
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "release=${release}" >> $GITHUB_OUTPUT

      ### Deploy

      # OC Login
      - name: OpenShift Login
        run: |
          # OC Login
          oc login --token=${{ secrets.oc_token }} --server=${{ inputs.oc_server }}
          oc project ${{ secrets.oc_namespace }} # Safeguard!

      # Secrets Management
      - name: Create Secrets
        run: |
          oc -n ${{ secrets.oc_namespace }} create secret generic "vdyp-oidc" \
          --from-literal=client-secret='${{ secrets.KEYCLOAK_CLIENT_SECRET }}' \
          --dry-run=client -o yaml | oc apply -f -

      - name: Deploy NATS
        working-directory: charts/nats
        env:
          NATS_PASSWORD: ${{ secrets.NATS_PASSWORD }}
        run: |
          nats_release="vdyp-nats"
          if [ -n "${{ inputs.environment }}" ]; then
            nats_release="${nats_release}-${{ inputs.environment }}"
          fi

          printf '%s' "$NATS_PASSWORD" > "$RUNNER_TEMP/nats-password"

          helm upgrade \
            --install "$nats_release" \
            --set auth.password="$(cat $RUNNER_TEMP/nats-password)" \
            --wait \
            --wait-for-jobs \
            --atomic \
            --timeout ${{ inputs.timeout-minutes }}m \
            .

      - name: Configure Helm
        working-directory: ${{ inputs.directory }}
        run: |
          # Preserve the chart version from the checked-out Chart.yaml.
          sed -i 's/^name:.*/name: ${{ github.event.repository.name }}/' Chart.yaml
          mkdir -p "$RUNNER_TEMP/vdyp-chart"
          helm package . --app-version="$DISPLAY_TAG" --destination "$RUNNER_TEMP/vdyp-chart"

      # Deploy Helm chart as atomic, with timeout
      - name: Atomic Helm Deployment
        working-directory: ${{ inputs.directory }}
        run: |
          # Helm upgrade/rollout - atomic, timeout
          helm upgrade \
            --values "$VALUES_FILE" \
            --set-string global.repository=${{ github.repository }} \
            --set-string global.tag="$DISPLAY_TAG" \
            ${{ inputs.params }} \
            --set global.secrets.databaseName=${{ vars.POSTGRES_DATABASE }} \
            --set global.secrets.databaseUser=${{ vars.POSTGRES_USER }} \
            --set global.secrets.databasePassword=${{ secrets.POSTGRES_PASSWORD }} \
            --set bitnami-pg.auth.username=${{ vars.POSTGRES_USER }} \
            --set bitnami-pg.auth.database=${{ vars.POSTGRES_DATABASE }} \
            --set global.secrets.VDYP_DB_PASSWORD=${{ secrets.VDYP_DB_PASSWORD }} \
            --set backend.env.QUARKUS_OIDC_AUTH_SERVER_URL=${{ secrets.VITE_SSO_TOKEN_ISSUER }}\
            --set backend.env.QUARKUS_OIDC_PUBLIC_KEY=${{ secrets.COMS_KEYCLOAK_PUBLICKEY }} \
            --set backend.env.VDYP_DB_USER=${{ vars.VDYP_DB_USER }} \
            --set backend.env.VDYP_DB_DATABASE=${{ vars.VDYP_DB_DATABASE }} \
            --set backend.env.COMS_BASE_URL=${{ vars.COMS_BASE_URL }} \
            --set backend.env.CORS_FRONTEND_BASE_URL=${{ vars.CORS_FRONTEND_BASE_URL }} \
            --set backend.env.BATCH_BASE_URL=${{ vars.BATCH_BASE_URL }} \
            --set backend.env.VDYP_PROJECTION_EXPIRY_DAYS=${{ vars.VDYP_PROJECTION_EXPIRY_DAYS }} \
            --set backend.env.VDYP_PROJECTION_STUCK_THRESHOLD_MINUTES=${{ vars.VDYP_PROJECTION_STUCK_THRESHOLD_MINUTES }} \
            --set backend.env.VDYP_PROJECTION_STUCK_CHECK_INTERVAL=${{ vars.VDYP_PROJECTION_STUCK_CHECK_INTERVAL }} \
            --set backend.env.VDYP_API_GATEWAY_JWT_JWKS_URI=${{ vars.VDYP_API_GATEWAY_JWT_JWKS_URI }} \
            --set backend.env.VDYP_API_GATEWAY_JWT_ISSUER=${{ vars.VDYP_API_GATEWAY_JWT_ISSUER }} \
            --set backend.env.VDYP_API_GATEWAY_JWT_AUDIENCE=${{ vars.VDYP_API_GATEWAY_JWT_AUDIENCE }} \
            --set backend.env.VDYP_BACKEND_MAX_POLYGONS=${{ vars.VDYP_BACKEND_MAX_POLYGONS }} \
            --set batch.env.VDYP_BASE_URL=${{ vars.VDYP_BASE_URL }} \
            --set batch.env.BATCH_SYSTEM_LOGGING_LEVEL=${{ vars.BATCH_SYSTEM_LOGGING_LEVEL }} \
            --set batch.env.VDYP_SYSTEM_LOGGING_LEVEL=${{ vars.VDYP_SYSTEM_LOGGING_LEVEL }} \
            --set batch.env.BATCH_DEFAULT_PARTITION_NUMBER=${{ vars.BATCH_DEFAULT_PARTITION_NUMBER }} \
            --set batch.env.BATCH_THREAD_POOL_SIZE=${{ vars.BATCH_THREAD_POOL_SIZE }} \
            --set batch.env.BATCH_MAX_JOB_THREADS=${{ vars.BATCH_MAX_JOB_THREADS }} \
            --set batch.env.BATCH_DB_CONNECITON_POOL_SIZE=${{ vars.BATCH_DB_CONNECITON_POOL_SIZE }} \
            --set batch.env.BATCH_STORAGE_THRESHOLD_PERCENT=${{ vars.BATCH_STORAGE_THRESHOLD_PERCENT }} \
            --set batch.env.BATCH_STORAGE_UNKNOWN_POLYGON_COUNT_PLACEHOLDER=${{ vars.BATCH_STORAGE_UNKNOWN_POLYGON_COUNT_PLACEHOLDER }} \
            --set batch.env.BATCH_PRIORITIZE_STOP_WAIT_TIMEOUT_SECONDS=${{ vars.BATCH_PRIORITIZE_STOP_WAIT_TIMEOUT_SECONDS }} \
            --set batch.env.BATCH_PRIORITIZE_STOP_POLL_INTERVAL_MILLIS=${{ vars.BATCH_PRIORITIZE_STOP_POLL_INTERVAL_MILLIS }} \
            --set frontend.env.BACKEND_URL=${{ vars.BACKEND_URL }} \
            --set frontend.env.VITE_SSO_AUTH_SERVER_URL=${{ secrets.VITE_SSO_AUTH_SERVER_URL }} \
            --set frontend.env.VITE_SSO_CLIENT_ID=${{ secrets.VITE_SSO_CLIENT_ID }} \
            --set frontend.env.VITE_SSO_REALM=${{ secrets.VITE_SSO_REALM }} \
            --set frontend.env.VITE_SSO_REDIRECT_URI=${{ secrets.VITE_SSO_REDIRECT_URI }} \
            --set frontend.env.VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --set frontend.env.VITE_SSO_TOKEN_ISSUER=${{ secrets.VITE_SSO_TOKEN_ISSUER }} \
            --set frontend.env.VITE_SITE_INDICES_TABLE_ENABLED=${{ vars.VITE_SITE_INDICES_TABLE_ENABLED }} \
            --set-string coms.image.tag=${{ vars.COMS_TAG }} \
            --set-string coms.env.OBJECTSTORAGE_ENABLED=true \
            --set-string coms.env.OBJECTSTORAGE_ACCESSKEYID=${{ vars.OBJECTSTORAGE_ACCESSKEYID }} \
            --set-string coms.env.OBJECTSTORAGE_SECRETACCESSKEY=${{ secrets.OBJECTSTORAGE_SECRETACCESSKEY }} \
            --set-string coms.env.OBJECTSTORAGE_BUCKET=${{ vars.OBJECTSTORAGE_BUCKET }} \
            --set-string coms.env.OBJECTSTORAGE_ENDPOINT=${{ vars.OBJECTSTORAGE_ENDPOINT }} \
            --set-string coms.env.OBJECTSTORAGE_KEY=${{ vars.OBJECTSTORAGE_KEY }} \
            --set-string coms.env.BASICAUTH_ENABLED=true \
            --set-string coms.env.BASICAUTH_USERNAME=${{ vars.COMS_SERVICE_USERNAME }} \
            --set-string coms.env.BASICAUTH_PASSWORD=${{ secrets.COMS_SERVICE_PASSWORD }} \
            --set-string coms.env.KC_ENABLED=true \
            --set-string coms.env.KC_PUBLICKEY=${{ secrets.COMS_KEYCLOAK_PUBLICKEY }} \
            --set-string coms.env.KC_REALM=${{ secrets.VITE_SSO_REALM }} \
            --set-string coms.env.KC_SERVERURL=${{ secrets.VITE_SSO_AUTH_SERVER_URL }} \
            --install --wait --atomic ${{ steps.vars.outputs.release }} \
            --timeout ${{ inputs.timeout-minutes }}m \
            "$RUNNER_TEMP/vdyp-chart/"*.tgz

      # Helm release history
      - name: Helm Release History
        run: |
          # Helm release history
          helm history ${{ steps.vars.outputs.release }}

      ### Cleanup

      # Completed pod cleanup
      - name: Pod Cleanup
        run: |
          # Completed pod cleanup
          oc delete po --field-selector=status.phase==Succeeded || true
