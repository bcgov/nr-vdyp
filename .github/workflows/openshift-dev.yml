name: Build and Deploy to Openshift Dev When PR

on:
  workflow_dispatch:
    inputs:
      package:
        description: All builds and deploys; a single component builds only
        required: true
        type: choice
        default: all
        options: [ all, backend, frontend, batch, log-exporter ]
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'batch/**'
      - 'log-exporter/**'
      - 'frontend/**'
      - 'lib/**'
      - 'buildtools/**'
      - 'pom.xml'
      - '.dockerignore'
      - 'charts/**'
      - 'nats/**'
      - '.github/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'backend/**'
      - 'batch/**'
      - 'log-exporter/**'
      - 'frontend/**'
      - 'lib/**'
      - 'buildtools/**'
      - 'pom.xml'
      - '.dockerignore'
      - 'charts/**'
      - 'nats/**'
      - '.github/**'

permissions:
  contents: read
  packages: write

# Do not cancel a workflow while it may be executing a Helm deployment.
concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  builds:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build-images.yml
    with:
      source_sha: ${{ github.sha }}
      pr_number: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || '' }}
      package: ${{ inputs.package || 'all' }}
    secrets: inherit

  deploy:
    needs: builds
    if: github.event_name != 'workflow_dispatch' || inputs.package == 'all'
    uses: ./.github/workflows/.deployer.yml
    secrets: inherit
    with:
      environment: dev
      ref: ${{ github.sha }}
      tag: ${{ needs.builds.outputs.short_sha }}
