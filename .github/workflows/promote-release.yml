name: Promote existing commit images and deploy
run-name: Promote ${{ inputs.source_sha }} as ${{ inputs.release_version }} to ${{ inputs.target_environment }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 12-character source commit SHA (never a PR number or branch)
        required: true
        type: string
      release_version:
        description: Version alias, for example 8.1.0-rc1 or 8.1.0
        required: true
        type: string
      target_environment:
        description: Complete external production approval before selecting prod
        required: true
        default: test
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read

jobs:
  promote:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/openshift-target-environment.yml
    secrets: inherit
    with:
      target_environment: ${{ inputs.target_environment }}
      source_sha: ${{ inputs.source_sha }}
      release_version: ${{ inputs.release_version }}
