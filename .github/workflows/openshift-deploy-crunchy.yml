name: Openshift DB deploy/update
run-name: Deploy PostgresCluster to ${{ inputs.ENVIRONMENT_NAME}}

on:
  workflow_call:
    inputs:
      ENVIRONMENT_NAME:
        required: true
        type: string
      TARGET_CLUSTER:
        default: ''
        type: string
      REPOSITORY:
        default: repo2
        type: string
      BACKUP_LABEL:
        default: ''
        type: string
      RECOVERY_TARGET:
        default: ''
        type: string
      POSTGRES_VERSION:
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      ENVIRONMENT_NAME:
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENVIRONMENT_NAME }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: copy crunchydb files
        run: mkdir staging && cp -r charts/crunchy-postgres staging/crunchy-postgres
      
      - name: Fill properties files
        uses: cschleiden/replace-tokens@v1.2
        with:
          files: staging/**/*
        env:
          LICENSE_PLATE: 'c50504'
          #Vault path is different for prod than all other environments
          #VAULT_RESOURCE: ${{ inputs.ENVIRONMENT_NAME == 'prod' && 'prod' || 'nonprod'  }}
          NAMESPACE: ${{ secrets.oc_namespace }}
          ENV: ${{ inputs.ENVIRONMENT_NAME }}
          DB_STORAGE: ${{ vars.DB_STORAGE }}
          DB_MAX_CPU: ${{ vars.DB_MAX_CPU }}
          DB_MAX_MEMORY: ${{ vars.DB_MAX_MEMORY}}
          DB_REPLICAS: ${{ vars.DB_INSTANCE_HA_REPLICAS }}
          DB_WAL_VOLUME_SIZE: ${{ vars.DB_WAL_VOLUME_SIZE }}
          DB_BACKUP_VOLUME_SIZE: ${{ vars.DB_BACKUP_VOLUME_SIZE }}
          DB_BACKUP_RETENTION_DAYS: ${{ inputs.ENVIRONMENT_NAME == 'prod' && '60' || '14' }}
          BOUNCER_REPLICAS: ${{ vars.DB_LOADBALANCER_HA_REPLICAS}}
          COMS_DB_USER: ${{ vars.COMS_DB_ROLE}}
          COMS_DB_NAME: ${{ vars.COMS_DB_DATABASE}}
          BATCH_DB_USER: ${{ vars.BATCH_DB_ROLE}}
          BATCH_DB_NAME: ${{ vars.BATCH_DB_DATABASE}}
          VDYP_DB_USER: ${{ vars.VDYP_DB_ROLE}}
          VDYP_PROXY_DB_USER: ${{ vars.VDYP_PROXY_DB_ROLE}}
          VDYP_DB_NAME: ${{ vars.VDYP_DB_DATABASE}}
          DB_BACKUP_S3_BUCKET: ${{ vars.OBJECTSTORAGE_BUCKET}}
          DB_BACKUP_S3_ENDPOINT: ${{ vars.OBJECTSTORAGE_ENDPOINT}}
          DB_BACKUP_S3_KEY: ${{ vars.OBJECTSTORAGE_ACCESSKEYID}}
          DB_BACKUP_S3_KEY_SECRET: ${{ secrets.OBJECTSTORAGE_SECRETACCESSKEY}}
          #S3_ENVIRONMENT: ${{ inputs.ENVIRONMENT_NAME == 'dev' && 'dev'  || (inputs.ENVIRONMENT_NAME == 'test' && 'tst' || (inputs.ENVIRONMENT_NAME == 'prod' && 'prd' || inputs.ENVIRONMENT_NAME)) }}

      - name: install helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      #Explicit install of oc cli tool
      - name: Install oc
        uses: redhat-actions/oc-installer@v1

      - name: Authenticate and set context
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.silver.devops.gov.bc.ca:6443
          openshift_token: ${{secrets.oc_token}}
          namespace: ${{ secrets.oc_namespace }}

      - name: zip and install helm chart
        if: inputs.TARGET_CLUSTER == ''
        env:
          SOURCE_ENVIRONMENT: ${{ inputs.ENVIRONMENT_NAME }}
        run: |
          cd staging && tar -czvf crunchy-postgres.tar.gz crunchy-postgres
          helm upgrade -i crunchy-postgres-$SOURCE_ENVIRONMENT ./crunchy-postgres.tar.gz

      - name: Install restored cluster using the deployment chart
        if: inputs.TARGET_CLUSTER != ''
        shell: bash
        env:
          NAMESPACE: ${{ secrets.oc_namespace }}
          SOURCE_ENVIRONMENT: ${{ inputs.ENVIRONMENT_NAME }}
          TARGET_CLUSTER: ${{ inputs.TARGET_CLUSTER }}
          REPOSITORY: ${{ inputs.REPOSITORY }}
          BACKUP_LABEL: ${{ inputs.BACKUP_LABEL }}
          RECOVERY_TARGET: ${{ inputs.RECOVERY_TARGET }}
          POSTGRES_VERSION: ${{ inputs.POSTGRES_VERSION }}
        run: |
          set -euo pipefail
          [[ "$TARGET_CLUSTER" =~ ^[a-z]([-a-z0-9]*[a-z0-9])?$ && ${#TARGET_CLUSTER} -le 40 ]]
          [[ "$TARGET_CLUSTER" != "crunchy-postgres-$SOURCE_ENVIRONMENT" ]]
          [[ "$REPOSITORY" == repo1 || "$REPOSITORY" == repo2 ]]
          # Recovery and future backups reuse the original namespace's S3 Secret.
          oc -n "$NAMESPACE" get secret "$SOURCE_ENVIRONMENT-postgres-s3-secret" -o name >/dev/null
          if [[ -n "$RECOVERY_TARGET" ]]; then date --date="$RECOVERY_TARGET" >/dev/null; fi
          if [[ -n "$(oc -n "$NAMESPACE" get postgrescluster "$TARGET_CLUSTER" --ignore-not-found -o name)" ]]; then
            echo 'Destination exists; use a new cluster name.' >&2
            exit 1
          fi
          umask 077
          jq -n --arg target "$TARGET_CLUSTER" --arg source "crunchy-postgres-$SOURCE_ENVIRONMENT" \
            --arg repo "$REPOSITORY" --arg backup "$BACKUP_LABEL" --arg time "$RECOVERY_TARGET" \
            --arg directory "vdyp-pgbackrest-$SOURCE_ENVIRONMENT" \
            '{fullnameOverride:$target, restore:{enabled:true, repository:$repo, sourceCluster:$source, backupLabel:$backup, recoveryTarget:$time, s3:{directoryName:$directory}}}' \
            > "$RUNNER_TEMP/restore-values.json"
          version_args=()
          if [[ -n "$POSTGRES_VERSION" ]]; then
            [[ "$POSTGRES_VERSION" =~ ^[0-9]{2}$ ]]
            version_args+=(--set "postgresVersion=$POSTGRES_VERSION")
          fi
          # Render the shared chart to check the effective version for PVC recovery.
          # Rendered output contains Secrets: never print or upload it.
          helm template "$TARGET_CLUSTER" staging/crunchy-postgres \
            -f "$RUNNER_TEMP/restore-values.json" "${version_args[@]}" \
            --show-only templates/PostgresCluster.yaml > "$RUNNER_TEMP/restore-cluster.yaml"
          if [[ "$REPOSITORY" == repo1 ]]; then
            version=$(awk '/^  postgresVersion:/ {print $2}' "$RUNNER_TEMP/restore-cluster.yaml")
            oc -n "$NAMESPACE" get postgrescluster "crunchy-postgres-$SOURCE_ENVIRONMENT" -o json \
              | jq -e --argjson version "$version" '.spec.postgresVersion == $version and any(.spec.backups.pgbackrest.repos[]; .name == "repo1" and .volume != null)' >/dev/null
          fi
          oc -n "$NAMESPACE" create --dry-run=server -f "$RUNNER_TEMP/restore-cluster.yaml"
          # Install only: never upgrade/overwrite an existing database during recovery.
          # Do not use --atomic: retain resources for diagnosis if restoration fails.
          helm install "$TARGET_CLUSTER" staging/crunchy-postgres -n "$NAMESPACE" \
            -f "$RUNNER_TEMP/restore-values.json" "${version_args[@]}"
          {
            echo '## Database restoration submitted'
            printf '\nHelm release / cluster: `%s`\n\nRepository: `%s`\n\nBackup: `%s`\n' "$TARGET_CLUSTER" "$REPOSITORY" "$BACKUP_LABEL"
            echo 'Crunchy manages the restore Job asynchronously; submission success is not recovery completion.'
            echo 'Follow charts/crunchy-postgres/RESTORE.md for monitoring, validation and application cutover.'
          } >> "$GITHUB_STEP_SUMMARY"
