name: Build application images

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit being built (PR merge SHA for pull_request events)
        required: true
        type: string
      pr_number:
        description: Optional convenience alias; never used to select an image
        required: false
        type: string
      package:
        description: Build one component without deployment, or all
        required: false
        default: all
        type: string
    outputs:
      short_sha:
        description: 12-character commit tag for display
        value: ${{ jobs.plan.outputs.short_sha }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      short_sha: ${{ steps.matrix.outputs.short_sha }}
      components: ${{ steps.matrix.outputs.components }}
    steps:
      - id: matrix
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Full internal source SHA required' >&2; exit 1; }
          echo "short_sha=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          case "$PACKAGE" in
            all) echo 'components=["backend","frontend","batch","log-exporter"]' >> "$GITHUB_OUTPUT" ;;
            backend|frontend|batch|log-exporter) echo "components=[\"$PACKAGE\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unknown component' >&2; exit 1 ;;
          esac
  build:
    name: Build ${{ matrix.component }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: plan
    concurrency:
      group: build-${{ needs.plan.outputs.short_sha }}-${{ matrix.component }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      COMPONENT: ${{ matrix.component }}
      SHORT_SHA: ${{ needs.plan.outputs.short_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set image tags
        id: tags
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$COMPONENT"
          tags="$image:$SHORT_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
            tags="$tags,$image:$PR_NUMBER"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: temurin
      - name: Read application version
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Build and publish commit image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            APP_VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
